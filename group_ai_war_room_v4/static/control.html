<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>集团 AI 作战室控制台</title><style>body{margin:0;background:#071019;color:#def8ff;font-family:system-ui,"PingFang SC"}main{max-width:1100px;margin:auto;padding:24px}.card{border:1px solid #1e6077;background:#071a27;padding:18px;margin-bottom:14px}h1{font-size:24px}h2{font-size:15px;color:#35e7ff}button,select,input{background:#041521;color:#dffaff;border:1px solid #225a70;padding:10px 12px;margin:4px}button:hover{border-color:#35e7ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.scene button{min-width:130px}.log{height:220px;overflow:auto;font:12px ui-monospace,monospace;color:#87b1bf;white-space:pre-wrap}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>集团 AI 数字孪生作战室 · 控制台</h1><div class="grid"><section class="card"><h2>当前企业</h2><select id="company"></select><button id="apply-company">切换企业</button><h2>大屏场景</h2><div class="scene" id="scenes"></div></section><section class="card"><h2>AI 演示控制</h2><button id="demo-alert">触发 CRITICAL 预警</button><button id="decision">启动 AI 决策</button><button id="simulate">启动方案仿真</button><h2>环境模式</h2><button id="ambient-on">开启 Ambient</button><button id="ambient-off">切换 Manual</button></section></div><section class="card"><h2>自然语言指令</h2><input id="command" style="width:70%" placeholder="例如：分析上海分公司最近利润为什么下降"><button id="send-command">执行</button></section><section class="card"><h2>系统状态</h2><div id="log" class="log"></div></section></main><script src="/static/js/control.js"></script></body></html>
